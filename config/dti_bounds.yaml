# config/dti_bounds.yaml - Giới hạn L, U để chuẩn hóa 11 chỉ số DTI:  z = 100 * min{1; max[0; (x - L)/(U - L)]}
# BẢN NHÁP (T040) soạn 2026-10-08. CHƯA KHÓA: locked=false. Script 10_score.py phải DỪNG nếu locked != true
# hoặc còn biến có L/U = null. Quy tắc (spec FR-10): L, U lấy từ chuẩn ngành / tài liệu công bố, KHÔNG lấy MAX/MIN của mẫu 5 NH.
# direction=lower_better: dùng z = 100 - z (hoặc đặt L > U); script 10 xử lý theo cột direction.
# status: sourced = đã có nguồn công bố kiểm chứng | natural = giới hạn tự nhiên của thang đo (cần nhóm xác nhận)
#         derived = suy ra có công thức từ chỉ số có nguồn (cần nhóm xác nhận) | needs_source = CHƯA có nguồn, L/U để null
locked: false
version: draft-2026-10-08

bounds:
  K-Q1:
    variable: digital_txn_share
    name: Tỷ lệ giao dịch khách hàng qua kênh số
    unit: "%"
    direction: higher_better
    L: 0
    U: 90
    status: sourced
    source_citation:
      - "NHNN, Quyết định 810/QĐ-NHNN (11/05/2021), Kế hoạch chuyển đổi số ngành Ngân hàng đến 2025, định hướng 2030: mục tiêu >= 70% giao dịch khách hàng qua kênh số năm 2025, 80% năm 2030 (theo Tin nhanh chứng khoán, https://www.tinnhanhchungkhoan.vn/ke-hoach-chuyen-doi-so-nganh-ngan-hang-la-hoan-toan-kha-thi-post270252.html)."
      - "Đại diện Vụ Thanh toán NHNN (Lê Anh Dũng), 15/04/2025: nhiều tổ chức tín dụng có hơn 90% giao dịch tài chính qua kênh số (Tạp chí Thị trường Tài chính Tiền tệ, https://thitruongtaichinhtiente.vn/hon-90-giao-dich-tai-chinh-tai-to-chuc-tin-dung-duoc-thuc-hien-qua-cac-kenh-so-67010.html)."
    rationale: "U = 90% là mức NHNN nêu cho nhóm tổ chức tín dụng dẫn đầu; L = 0 (không có giao dịch số). Mục tiêu 70% của QĐ 810 là mốc trung gian, không dùng làm U vì nhiều NH đã vượt. Giữ cố định mọi năm để so sánh được theo thời gian."
    caveat: "Mỗi NH định nghĩa 'giao dịch số' khác nhau (số lượng vs giá trị, bán lẻ vs toàn hàng); ghi định nghĩa gốc vào dti_inputs.note."

  K-Q2:
    variable: digital_customer_share
    name: Tỷ lệ khách hàng số / tổng khách hàng
    unit: "%"
    direction: higher_better
    L: 0
    U: 100
    status: natural
    source_citation: []
    rationale: "Thang tỷ lệ tự nhiên 0-100%. Chưa tìm được chuẩn ngành công bố cho 'khách hàng số / tổng khách hàng' (định nghĩa 'khách hàng số' khác nhau giữa các NH; tcb 2024 không công bố riêng)."
    caveat: "U = 100 làm z thấp cho mọi NH; nhóm cần xác nhận hoặc thay bằng nguồn công bố. Nếu NH không công bố -> để trống (không điền 0)."

  K-Q3:
    variable: app_rating
    name: Điểm đánh giá ứng dụng (gộp App Store + Google Play, trọng số theo lượt đánh giá)
    unit: sao (1-5)
    direction: higher_better
    L: 1
    U: 5
    status: sourced
    source_citation:
      - "Thang điểm 1-5 sao của Apple App Store và Google Play; công thức z = (r - 1)/4 * 100 theo data-model.md."
    rationale: "Giới hạn là biên của thang đánh giá do cửa hàng ứng dụng quy định."
    caveat: "Điểm chỉ có tại ngày thu thập (05_app_ratings.py ghi ngày); không có lịch sử theo năm -> ghi rõ trong phương pháp."

  S-Q1:
    variable: delta_digital_txn_share
    name: Thay đổi tỷ lệ giao dịch số so với năm trước
    unit: điểm %/năm
    direction: higher_better
    L: 0
    U: 18
    status: derived
    source_citation:
      - "Suy ra từ K-Q1: (U_K-Q1 - L_K-Q1) / 5 năm = 90/5 = 18 điểm %/năm, 5 = độ dài kế hoạch QĐ 810 (2021-2025)."
    rationale: "Tốc độ cần có để đi từ 0 lên mức dẫn đầu 90% trong khung 5 năm của kế hoạch NHNN; L = 0 (không cải thiện). Giảm so với năm trước cho z = 0."
    caveat: "Công thức tự suy ra, không phải chuẩn ngành công bố -> nhóm cần đồng ý. NH đã gần trần (>85%) khó có Δ lớn: cân nhắc ghi nhận hạn chế này."

  S-Q2:
    variable: digital_customers_cagr
    name: Tăng trưởng kép số khách hàng số (CAGR)
    unit: "%/năm"
    direction: higher_better
    L: null
    U: null
    status: needs_source
    source_citation: []
    rationale: "CHƯA có nguồn. Gợi ý tìm: thống kê NHNN về tăng trưởng số tài khoản thanh toán / người dùng mobile-internet banking theo năm (bài NHNN 04/2025 chỉ nêu tăng trưởng GIAO DỊCH: Internet +35%, mobile +33%, QR +66% so cùng kỳ 2024 - không phải số khách hàng nên chưa dùng được)."
    caveat: "Cần 2 mốc số khách hàng số cùng định nghĩa; nhiều NH không công bố."

  T-Q1:
    variable: software_cost_to_assets
    name: Nguyên giá phần mềm máy tính cuối kỳ / tổng tài sản bình quân
    unit: "%"
    direction: higher_better
    L: null
    U: null
    status: needs_source
    source_citation: []
    rationale: "CHƯA có chuẩn ngành công bố cho tỷ lệ này (khác với chi tiêu CNTT/doanh thu). Cần nguồn: báo cáo benchmark chi đầu tư phần mềm của ngân hàng (Gartner/IDC/Celent...) hoặc nghiên cứu học thuật; hoặc đổi định nghĩa chỉ số."
    caveat: "Giá trị thực tế rất nhỏ (ví dụ tcb 2024: 6,514,231 / 978,798,549 = 0.67%); U cần cùng bậc độ lớn."

  T-Q2:
    variable: platform_coverage
    name: Tỷ lệ phủ 8 nền tảng số (checklist manual_audit.xlsx)
    unit: "%"
    direction: higher_better
    L: 0
    U: 100
    status: natural
    source_citation:
      - "Checklist 8 nền tảng do đề tài định nghĩa (scripts/00_make_templates.py, PLAT)."
    rationale: "Chỉ số tự định nghĩa: số nền tảng đạt / 8; biên tự nhiên 0-100%."
    caveat: "Chỉ có tại thời điểm kiểm kê (ngày ghi trong manual_audit.xlsx), không có lịch sử theo năm."

  O-Q1:
    variable: delta_cir
    name: Thay đổi tỷ lệ chi phí / thu nhập (CIR) so với năm trước
    unit: điểm %/năm
    direction: lower_better
    L: null
    U: null
    status: needs_source
    source_citation: []
    rationale: "CHƯA chốt. Tham chiếu mức CIR (không phải Δ): BCG (2016), 'Retail Bank Operational and Digital Leaders Reap the Rewards': CIR nhóm tứ phân vị đầu 47%, trung vị 54% (chênh 7 điểm %) - https://www.bcg.com/en-cl/publications/2016/financial-institutions-retail-banks-operational-and-digital-leaders-reap-the-rewards-part-of-banking-on-digital-simplicity . Có thể dùng chênh 7 điểm % làm biên Δ nhưng cần nhóm đồng ý."
    caveat: "Δ CIR bị ảnh hưởng chu kỳ lãi suất/dự phòng, không chỉ chuyển đổi số."

  O-Q2:
    variable: income_per_employee_cagr
    name: Tăng trưởng kép thu nhập hoạt động trên mỗi CBNV (CAGR)
    unit: "%/năm"
    direction: higher_better
    L: null
    U: null
    status: needs_source
    source_citation: []
    rationale: "CHƯA có nguồn. Gợi ý: tốc độ tăng năng suất lao động / thu nhập hoạt động ngành ngân hàng từ thống kê NHNN hoặc Tổng cục Thống kê."
    caveat: "CBNV phải cùng định nghĩa (bình quân hay cuối kỳ)."

  C-Q1:
    variable: tech_staff_share
    name: Tỷ lệ nhân sự công nghệ / tổng CBNV
    unit: "%"
    direction: higher_better
    L: null
    U: null
    status: needs_source
    source_citation: []
    rationale: "CHƯA có nguồn công khai kiểm chứng. Tìm: báo cáo IT staffing của Gartner/KPMG Banking Systems Survey hoặc báo cáo bền vững các ngân hàng/fintech tham chiếu. tcb 2024 không công bố số nhân sự công nghệ riêng -> nhiều NH sẽ để trống."
    caveat: "Rủi ro dữ liệu thiếu cao nhất trong 11 chỉ số."

  C-Q2:
    variable: training_hours_per_head
    name: Số giờ đào tạo bình quân / CBNV
    unit: giờ/người/năm
    direction: higher_better
    L: 0
    U: null
    status: needs_source
    source_citation:
      - "Tham chiếu chung (không riêng ngân hàng, chủ yếu doanh nghiệp Mỹ): ATD State of the Industry 2025 - trung bình 13.7 giờ học chính thức/nhân viên năm 2024; 17.4 giờ năm 2023 (https://www.td.org/content/atd-blog/benchmarks-and-trends-from-the-2025-state-of-the-industry-report)."
    rationale: "Nếu lấy U = 13.7 thì các NH Việt Nam (tcb 2024: 54.7 giờ) đều đạt 100 và chỉ số mất khả năng phân biệt; ATD đo 'giờ học chính thức' khác cách các NH Việt Nam tính (gồm cả e-learning/nội bộ). Cần chốt U từ nguồn riêng ngành tài chính-ngân hàng hoặc ghi rõ đây là hạn chế."
    caveat: "Định nghĩa giờ đào tạo khác nhau giữa NH; ghi chú trong dti_inputs."

# Ghi chú cho người chấm/nhóm:
#  - 2/11 sourced (K-Q1, K-Q3); 3/11 natural/derived cần nhóm xác nhận (K-Q2, T-Q2, S-Q1); 6/11 needs_source (S-Q2, T-Q1, O-Q1, O-Q2, C-Q1, C-Q2).
#  - Theo spec: chưa có nguồn thì KHÔNG tự lấy MAX mẫu; phương án thay thế phải ghi nguồn và lý do trước khi chấm.
#  - Nếu không tìm được nguồn: (a) ghi 'không chuẩn hóa được' và để trống chỉ số đó (data_confidence giảm), hoặc (b) đổi định nghĩa chỉ số.
